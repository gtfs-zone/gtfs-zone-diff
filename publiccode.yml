publiccodeYmlVersion: "0.4"

name: GTFS.zone Diff
url: "https://github.com/gtfs-zone/gtfs-zone-diff"
landingURL: "https://diff.gtfs.zone"

platforms:
  - web

categories:
  - data-visualization
  - geographic-information-systems

developmentStatus: concept

softwareType: "standalone/web"

description:
  en:
    shortDescription: >
      Compare two GTFS feeds in the browser.
    longDescription: >
      GTFS.zone Diff compares two GTFS schedule feeds, from a URL, an upload,
      the gtfs.zone feed catalog or the feeds stored in the browser, and shows
      every difference between them on a map and side by side. It is a static
      single-page app with no backend of its own.
    features:
      - Compare any two GTFS feeds
      - Shareable links naming both feeds

